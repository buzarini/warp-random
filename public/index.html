<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8fafc">
    <title>WARP Random</title>
    <link rel="icon" type="image/x-icon" href="/static/cloud.ico">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="page">
        <img src="/static/logo.svg" alt="Logo" class="logo">

        <section class="card">
            <header class="card-header">
                <img src="/static/awg.webp" alt="AmneziaWG" class="awg-icon">
                <span class="brand">AmneziaWG</span>
            </header>

            <div class="line"></div>

            <div class="field-header">
                <label class="field-label" for="domain">Введите домен:</label>
                <select id="quicLevel" class="quic-select" aria-label="QUIC уровень">
                    <option value="0" selected>Unoptimized (old)</option>
                    <option value="1">Safe Reorder</option>
                    <option value="2">+ Screw TLS Header</option>
                    <option value="3">++ Cut Screwed</option>
                    <option value="4">+++ Cut Zeroes</option>
                </select>
            </div>

            <div class="input-wrapper">
                <input
                    type="text"
                    id="domain"
                    class="domain-input"
                    placeholder="www.cloudflare.com"
                    autocomplete="off"
                    spellcheck="false"
                >
                <button type="button" id="clearBtn" class="clear-btn" aria-label="Очистить">×</button>
            </div>

            <div class="mode-panel">
                <button type="button" class="mode-btn active" data-mode="auto">авто</button>
                <button type="button" class="mode-btn" data-mode="ip">ip</button>
                <button type="button" class="mode-btn" data-mode="domain">домен</button>
            </div>

            <select id="ipRangeSelect" class="ip-range-select hidden" aria-label="IP диапазон">
                <option value="">Все диапазоны (случайно)</option>
                <option value="8.6.112.0">8.6.112.0/24</option>
                <option value="8.34.70.0">8.34.70.0/24</option>
                <option value="8.34.146.0">8.34.146.0/24</option>
                <option value="8.35.211.0">8.35.211.0/24</option>
                <option value="8.39.125.0">8.39.125.0/24</option>
                <option value="8.39.204.0">8.39.204.0/24</option>
                <option value="8.39.214.0">8.39.214.0/24</option>
                <option value="8.47.69.0">8.47.69.0/24</option>
                <option value="188.114.96.0">188.114.96.0/24</option>
                <option value="188.114.97.0">188.114.97.0/24</option>
                <option value="188.114.98.0">188.114.98.0/24</option>
                <option value="188.114.99.0">188.114.99.0/24</option>
                <option value="162.159.192.0">162.159.192.0/24</option>
                <option value="162.159.195.0">162.159.195.0/24</option>
            </select>

            <button type="button" id="generateBtn" class="generate-btn">Сгенерировать</button>

            <div id="status" class="status hidden" role="status"></div>

            <div class="line"></div>

            <footer class="footer">
                <a href="https://github.com/buzarini/warp-random" target="_blank" rel="noopener noreferrer">
                    Исходный код
                </a>
            </footer>
        </section>
    </main>

    <script src="/static/quic.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
